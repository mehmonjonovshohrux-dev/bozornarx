# Render Blueprint. Plans below are FREE so you can try it; read docs/DEPLOY_RENDER.md before real use
# (free web services sleep after 15 min; the free database expires after 30 days).
# Database: Supabase (external). Paste its Session-pooler URL into DATABASE_URL in the Render dashboard.
services:
  - type: web
    name: bozornarx-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SWAGGER
        value: "false"
      - key: MAIL_MODE
        value: apps_script
      - key: SMS_PROVIDER_MODE
        value: mock
      - key: DATABASE_URL
        sync: false      # Supabase Session pooler URL (port 5432); set only in the Render dashboard
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: OTP_HASH_PEPPER
        generateValue: true
      - key: WEB_ORIGIN
        sync: false      # https://<your-web-service>.onrender.com
      - key: APP_URL
        sync: false      # same as WEB_ORIGIN
      - key: GAS_URL
        sync: false
      - key: GAS_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false      # optional: `npx web-push generate-vapid-keys`; without it push returns 503
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false      # mailto:you@example.com
      - key: EIMZO_MODE
        value: disabled  # real E-IMZO verification is not implemented; see DECISIONS.md
      - key: PAYMENT_PROVIDER_MODE
        value: none      # no card provider connected: cash on delivery only
      - key: MAINTENANCE_ENABLED
        value: "true"

  - type: web
    name: bozornarx-web
    runtime: node
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_URL
        sync: false      # https://<your-api-service>.onrender.com  (needed BEFORE the build)
